version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: bhumi_satya_postgis
    environment:
      POSTGRES_DB: bhumi_satya
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bhumi_satya_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/bhumi_satya
      SECRET_KEY: BHUMI_SATYA_SECRET_KEY_SUPER_SECURE_SIH2026_PROTOTYPE_DEMO_KEY
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "python seed_data.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bhumi_satya_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
